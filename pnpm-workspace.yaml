packages:
  - packages/*
  - apps/*
  - functions

# Supply-chain guard: a package version must be at least 1 day old before pnpm
# installs it. Most malicious npm releases are pulled within hours. If a fresh
# release is needed urgently, add the package to minimumReleaseAgeExclude and
# remove it again once the window has passed.
minimumReleaseAge: 1440

# Packages allowed to run install scripts.
onlyBuiltDependencies:
  - esbuild
